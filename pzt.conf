# pzt settings for ShoutShockwave (bash syntax, sourced by pzt). One client, every scenario.
MOD_SRC="Contents/mods"
MODS="ShoutShockwave"
TEST_FILES=("tests/ShoutShockwave_Test.lua ShoutShockwave/42/media/lua/client/")
# a small sandbox save (NeckSlot's test save, copied fresh every run)
SAVE="$PROJECT/../NeckSlot/tests/save/Sandbox/2026-10-18_00-11-37"
LOG_GREP='\[(ShoutShockwave|SFXTest)\]'
# SFXTest.start() = every scenario; SFXTest.startFix() = 0.1.3 endurance fix only (see .pzt_plan.md)
STEPS=(
  "lua SFXTest.start()"
  "wait 60"
  "lua SFXTest.poll()"
)
HEAP=2048m
MEM_WAIT=600
TIMEOUT=1200
# effect preview (tests/ShoutShockwave_Preview.lua) and its candidate textures from the devnotes
TEST_FILES+=("tests/ShoutShockwave_Preview.lua ShoutShockwave/42/media/lua/client/" "tests/ShoutShockwave_Gif.lua ShoutShockwave/42/media/lua/client/")
for _pv in "$PROJECT"/../_devnotes/ShoutShockwave/candidates/*/*.png; do
  case "$_pv" in */sheets/*) continue ;; esac
  TEST_FILES+=("../_devnotes/ShoutShockwave/candidates/$(basename "$(dirname "$_pv")")/$(basename "$_pv") ShoutShockwave/42/media/textures/ShoutShockwave_pv/")
done
